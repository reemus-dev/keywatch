name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: verify
    permissions:
      contents: write
    runs-on: macos-15
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.8.16
          cache: true

      - name: Strip the tag prefix
        run: echo "VERSION=${VERSION#v}" >>"$GITHUB_ENV"

      - name: Build release archives
        run: mise run release:build

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" dist/*.tar.gz dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" --title "v$VERSION" --generate-notes --verify-tag

      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY is not set, so the tap was not updated"
            exit 0
          fi
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" >"$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:reemus-dev/homebrew-tap.git "$RUNNER_TEMP/tap"
          mise run release:formula >"$RUNNER_TEMP/tap/Formula/keywatch.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/keywatch.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "keywatch $VERSION"
          git push
